<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MEGA SCAN v28.0 // ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020305; --panel: rgba(8, 15, 12, 0.7); --border: rgba(0, 255, 170, 0.25);
    --main: #00ffaa; --main-glow: rgba(0, 255, 170, 0.5); --text: #e0f0e8;
    --text-muted: #508870; --danger: #ff2a55; --warn: #ffbb00; --info: #00d4ff;
  }
  [data-theme="light"] { --bg: #f0f4f8; --panel: rgba(255, 255, 255, 0.85); --border: rgba(0, 100, 80, 0.3); --main: #007a5e; --main-glow: rgba(0, 122, 94, 0.3); --text: #1a2a22; --text-muted: #6b8a7a; --danger: #c0392b; --warn: #d35400; --info: #2980b9; }
  [data-theme="cyber"] { --bg: #0b0c10; --panel: rgba(31, 40, 51, 0.85); --border: rgba(252, 238, 10, 0.3); --main: #fcee0a; --main-glow: rgba(252, 238, 10, 0.5); --text: #c5c6c7; --text-muted: #45a29e; --danger: #ff003c; --warn: #f39c12; --info: #00e5ff; }
  [data-theme="matrix"] { --bg: #000000; --panel: rgba(0, 20, 0, 0.85); --border: rgba(0, 255, 65, 0.3); --main: #00ff41; --main-glow: rgba(0, 255, 65, 0.6); --text: #00ff41; --text-muted: #008800; --danger: #ff0000; --warn: #ffff00; --info: #00ffff; }
  [data-theme="blood"] { --bg: #1a0505; --panel: rgba(43, 10, 10, 0.85); --border: rgba(255, 0, 0, 0.3); --main: #ff0000; --main-glow: rgba(255, 0, 0, 0.5); --text: #f5d6d6; --text-muted: #9c6060; --danger: #ff4444; --warn: #ffaa00; --info: #ff6666; }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% -10%, var(--main-glow) 0%, transparent 60%), linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px; color: var(--text); font-size: 14px;
    padding: 10px; padding-top: 100px; min-height: 100vh; overflow-x: hidden;
    transition: background-color 0.3s;
  }

  /* Переключатель тем */
  .theme-switcher { position: fixed; top: 10px; right: 10px; z-index: 2001; display: flex; gap: 6px; background: var(--panel); padding: 6px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
  .theme-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
  .theme-dot.active { border-color: var(--text); transform: scale(1.1); }
  .theme-dot[data-theme="dark"] { background: #020305; } .theme-dot[data-theme="light"] { background: #f0f4f8; } .theme-dot[data-theme="cyber"] { background: #fcee0a; } .theme-dot[data-theme="matrix"] { background: #00ff41; } .theme-dot[data-theme="blood"] { background: #ff0000; }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; letter-spacing: 6px; color: var(--main); text-shadow: 0 0 15px var(--main-glow); }
  .header p { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 3px; margin-top: 5px; }

  /* Меню выбора */
  .category-menu { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; max-width: 800px; margin-left: auto; margin-right: auto; }
  .category-menu::-webkit-scrollbar { display: none; }
  .cat-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 20px; padding: 8px 16px; font-family: 'Share Tech Mono', monospace; font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: 0.3s; text-transform: uppercase; backdrop-filter: blur(5px);
  }
  .cat-btn.active { background: var(--main); color: var(--bg); border-color: var(--main); box-shadow: 0 0 15px var(--main-glow); font-weight: bold; }

  .search-box { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; max-width: 800px; margin-left: auto; margin-right: auto; }
  .input-wrapper { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; display: flex; align-items: center; padding: 2px; backdrop-filter: blur(5px); transition: 0.3s; }
  .input-wrapper:focus-within { border-color: var(--main); box-shadow: 0 0 20px var(--main-glow); }
  .input-prefix { padding-left: 15px; color: var(--main); font-family: 'Share Tech Mono', monospace; font-size: 16px; }
  input[type="text"] { width: 100%; background: transparent; border: none; color: var(--text); padding: 14px; font-family: 'Share Tech Mono', monospace; font-size: 15px; outline: none; }
  
  .action-btn { background: var(--main); color: var(--bg); border: none; padding: 16px; border-radius: 14px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 20px var(--main-glow); transition: 0.2s; }
  .action-btn:active { transform: scale(0.98); }
  .action-btn:disabled { background: #333; color: #666; box-shadow: none; }

  /* ДЕРЕВО РЕЗУЛЬТАТОВ */
  #result-container { display: none; max-width: 800px; margin: 0 auto; animation: slideUp 0.4s ease; }
  .tree-root { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--main); font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px var(--main-glow); }
  .tree-branch { margin-left: 10px; border-left: 1px dashed var(--border); padding-left: 20px; display: flex; flex-direction: column; gap: 12px; }
  
  .tree-item { position: relative; }
  .tree-item::before { content: '├──'; position: absolute; left: -26px; top: 4px; color: var(--border); font-family: 'Share Tech Mono', monospace; font-size: 14px; }
  .tree-item:last-child::before { content: '└──'; }

  .site-header { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text); }
  
  .site-data { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; font-family: 'Share Tech Mono', monospace; font-size: 13px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(10px); }
  .site-data.found { border-left: 4px solid var(--main); }
  .site-data.notfound { border-left: 4px solid var(--danger); color: var(--text-muted); font-style: italic; }
  .site-data.loading { border-left: 4px solid var(--warn); color: var(--warn); animation: pulse 1s infinite; }
  
  .data-line { display: flex; gap: 5px; flex-wrap: wrap; }
  .data-line b { color: var(--info); font-weight: normal; }
  .data-line span { color: #fff; word-break: break-all; }
  .data-line a { color: var(--main); text-decoration: none; border-bottom: 1px dotted var(--main); }
  .data-line a:hover { color: #fff; border-color: #fff; }

  .dorks-box { background: rgba(0, 212, 255, 0.05); border: 1px solid var(--info); border-radius: 12px; padding: 15px; margin-top: 25px; backdrop-filter: blur(5px); animation: slideUp 0.6s ease; }
  .dorks-title { font-family: 'Orbitron', sans-serif; color: var(--info); font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed var(--info); padding-bottom: 8px; font-size: 14px; }
  .dorks-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .dork-link { background: rgba(0, 212, 255, 0.1); color: var(--info); padding: 8px 12px; border-radius: 8px; text-decoration: none; font-family: 'Share Tech Mono', monospace; font-size: 12px; border: 1px solid var(--info); transition: 0.2s; }
  .dork-link:hover { background: var(--info); color: #000; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

<script>
// ================= ТЕМЫ =================
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
  document.querySelector(`.theme-dot[data-theme="${theme}"]`).classList.add('active');
  localStorage.setItem('osint_theme_ultimate', theme);
}
setTheme(localStorage.getItem('osint_theme_ultimate') || 'dark');

// ================= ВЫБОР РЕЖИМА =================
let currentMode = 'auto';
function setMode(mode, event) {
  currentMode = mode;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const placeholders = {
    'auto': 'Введи цель (определю сам)...', 'username': 'Ник (например: moonidtes)', 
    'email': 'Email (test@mail.ru)', 'phone': 'Телефон (+7900...)', 
    'ip': 'IP (8.8.8.8)'
  };
  document.getElementById('query').placeholder = placeholders[mode];
}

// ================= СЕТЬ =================
const PROXIES = ["https://api.allorigins.win/raw?url=", "https://api.codetabs.com/v1/proxy?quest=", "https://corsproxy.io/?"];

async function fetchProxy(url, timeoutMs = 8000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
      clearTimeout(timer);
      if (res.ok) return res;
    } catch { continue; }
  }
  return null;
}

// ================= ИСТОЧНИКИ =================
function getSources(query, type) {
  if (type === 'username') {
    return [
      { id: 'wmn', name: 'WHATSMYNAME (700+ САЙТОВ)', url: `https://whatsmyname.app/api/lookup?username=${query}`, type: 'json',
        check: (d) => d && Array.isArray(d.sites) && d.sites.filter(s=>s.status==='claimed').length > 0,
        parse: (d) => {
          const claimed = d.sites.filter(s => s.status === 'claimed');
          return claimed.slice(0, 25).map(s => `<div class="data-line"><b>${s.name}:</b> <a href="${s.url}" target="_blank">${s.url}</a></div>`).join('');
        }
      },
      { id: 'gh', name: 'GITHUB', url: `https://api.github.com/users/${query}`, type: 'json', check: (d) => d && !d.message,
        parse: (d) => `<div class="data-line"><b>Имя:</b> <span>${d.name||'Скрыто'}</span></div><div class="data-line"><b>Репозитории:</b> <span>${d.public_repos}</span></div><div class="data-line"><a href="${d.html_url}" target="_blank">Профиль</a></div>`
      },
      { id: 'tg', name: 'TELEGRAM', url: `https://t.me/${query}?embed=1`, type: 'text', check: (d) => d.includes('tgme_page_title'),
        parse: (d) => {
          const doc = new DOMParser().parseFromString(d, 'text/html');
          const title = doc.querySelector('.tgme_page_title')?.textContent.trim() || 'Скрыто';
          return `<div class="data-line"><b>Имя:</b> <span>${title}</span></div><div class="data-line"><a href="https://t.me/${query}" target="_blank">t.me/${query}</a></div>`;
        }
      },
      { id: 'vk', name: 'VK', url: `https://vk.com/${query}`, type: 'text', check: (d) => d.includes('og:title') && !d.includes('404'),
        parse: (d) => `<div class="data-line"><a href="https://vk.com/${query}" target="_blank">vk.com/${query}</a></div>`
      },
      { id: 'reddit', name: 'REDDIT', url: `https://www.reddit.com/user/${query}/about.json`, type: 'json', check: (d) => d.data && !d.data.error,
        parse: (d) => `<div class="data-line"><b>Карма:</b> <span>${d.data.total_karma}</span></div><div class="data-line"><b>Создан:</b> <span>${new Date(d.data.created_utc*1000).toLocaleDateString()}</span></div>`
      },
      { id: 'tiktok', name: 'TIKTOK', url: `https://www.tiktok.com/@${query}`, type: 'text', check: (d) => d.includes('og:title') && !d.includes('Couldn\'t find'),
        parse: (d) => `<div class="data-line"><a href="https://www.tiktok.com/@${query}" target="_blank">tiktok.com/@${query}</a></div>`
      },
      { id: 'twitch', name: 'TWITCH', url: `https://www.twitch.tv/${query}`, type: 'text', check: (d) => d.includes('og:title') && !d.includes('404'),
        parse: (d) => `<div class="data-line"><a href="https://www.twitch.tv/${query}" target="_blank">twitch.tv/${query}</a></div>`
      },
      { id: 'steam', name: 'STEAM', url: `https://steamcommunity.com/id/${query}/?xml=1`, type: 'text', check: (d) => d.includes('<steamID>'),
        parse: (d) => `<div class="data-line"><a href="https://steamcommunity.com/id/${query}" target="_blank">steamcommunity.com</a></div>`
      }
    ];
  } 
  if (type === 'email') {
    return [
      { id: 'leaks', name: 'УТЕЧКИ (XPOSEDORNOT)', url: `https://api.xposedornot.com/v1/check-email/${query}`, type: 'json', check: (d) => d.breaches && d.breaches.length > 0,
        parse: (d) => `<div class="data-line"><b>Баз:</b> <span style="color:var(--danger)">${d.breaches.length} шт.</span></div>`
      },
      { id: 'disify', name: 'DISIFY (ОДНОРАЗОВАЯ)', url: `https://disify.com/api/email/${query}`, type: 'json', check: (d) => d.format !== undefined,
        parse: (d) => `<div class="data-line"><b>Одноразовый:</b> <span>${d.disposable ? 'ДА' : 'НЕТ'}</span></div>`
      },
      { id: 'gravatar', name: 'GRAVATAR', url: `https://www.gravatar.com/avatar/${md5(query.toLowerCase())}?d=404`, type: 'text', check: (res) => res.status !== 404,
        parse: () => `<div class="data-line"><b>Аватар:</b> <img src="https://www.gravatar.com/avatar/${md5(query.toLowerCase())}?s=50" style="border-radius:50%;"></div>`
      }
    ];
  }
  if (type === 'phone') {
    return [
      { id: 'phone', name: 'ОПЕРАТОР СВЯЗИ', url: `https://carrier-lookup-api.omkar.cloud/lookup?phone=${query}`, type: 'json', check: (d) => d.is_valid_number,
        parse: (d) => `<div class="data-line"><b>Оператор:</b> <span>${d.carrier}</span></div>`
      }
    ];
  }
  if (type === 'ip') {
    return [
      { id: 'ip', name: 'ГЕОЛОКАЦИЯ IP', url: `https://ipwho.is/${query}`, type: 'json', check: (d) => d.success,
        parse: (d) => `<div class="data-line"><b>Страна:</b> <span>${d.country}</span></div><div class="data-line"><b>Провайдер:</b> <span>${d.connection.isp}</span></div>`
      }
    ];
  }
  return [];
}

// ================= ЗАПУСК =================
async function startScan() {
  const raw = document.getElementById('query').value.trim();
  const q = raw.replace(/^@/, '');
  if (!q) return alert('Введи данные!');

  let type = currentMode;
  if (type === 'auto') {
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q)) type = 'email';
    else if (/^\+?[0-9]{10,15}$/.test(q)) type = 'phone';
    else if (/^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(q)) type = 'ip';
    else type = 'username';
  }

  const btn = document.getElementById('search-btn');
  const container = document.getElementById('result-container');
  btn.disabled = true;
  container.style.display = 'block';
  container.innerHTML = `<div class="tree-root">📁 [${type.toUpperCase()}] ${q}</div><div class="tree-branch" id="branch"></div>`;
  const branch = document.getElementById('branch');

  const sources = getSources(q, type);

  if (sources.length === 0) {
    branch.innerHTML = `<div style="color:var(--danger)">Для этого типа данных нет прямых API.</div>`;
  } else {
    sources.forEach(src => {
      const item = document.createElement('div');
      item.className = 'tree-item';
      item.innerHTML = `<div class="site-header"><span id="icon-${src.id}">⏳</span> ${src.name}</div><div class="site-data loading" id="data-${src.id}">Запрос...</div>`;
      branch.appendChild(item);
    });

    const promises = sources.map(src => {
      return fetchProxy(src.url).then(async res => {
        if (!res) return { src, data: null, res };
        const isJson = src.type === 'json';
        const data = isJson ? await res.json() : await res.text();
        return { src, data, res };
      }).catch(e => ({ src, data: null, error: e.message }));
    });

    const results = await Promise.allSettled(promises);

    results.forEach((result, index) => {
      const src = sources[index];
      const icon = document.getElementById(`icon-${src.id}`);
      const dataEl = document.getElementById(`data-${src.id}`);

      if (result.status === 'fulfilled' && result.value.data) {
        const { data, res } = result.value;
        if (src.check(data, res)) {
          icon.innerText = '🟢';
          dataEl.className = 'site-data found';
          dataEl.innerHTML = src.parse(data);
        } else {
          icon.innerText = '🔴';
          dataEl.className = 'site-data notfound';
          dataEl.innerText = 'Ничего не найдено.';
        }
      } else {
        icon.innerText = '⚠️';
        dataEl.className = 'site-data notfound';
        dataEl.innerText = 'Ошибка / Таймаут.';
      }
    });
  }

  // DORKS
  const dorksContainer = document.createElement('div');
  dorksContainer.className = 'dorks-box';
  let dorkHtml = `<div class="dorks-title">ГЛУБОКИЙ ПОИСК (DORKS)</div><div class="dorks-grid">`;
  
  if (type === 'username') {
    const sites = ['vk.com', 'ok.ru', 't.me', 'avito.ru', 'pikabu.ru', 'github.com', 'pastebin.com'];
    sites.forEach(site => {
      dorkHtml += `<a href="https://www.google.com/search?q=%22${q}%22+site:${site}" target="_blank" class="dork-link">Google: ${site}</a>`;
    });
    dorkHtml += `<a href="https://yandex.ru/search/?text=%22${q}%22+site:vk.com" target="_blank" class="dork-link">Yandex: VK</a>`;
  } else if (type === 'email') {
    dorkHtml += `<a href="https://www.google.com/search?q=%22${q}%22" target="_blank" class="dork-link">Google</a>`;
    dorkHtml += `<a href="https://haveibeenpwned.com/account/${q}" target="_blank" class="dork-link">HIBP</a>`;
    dorkHtml += `<a href="https://leakcheck.io/check?query=${q}" target="_blank" class="dork-link">LeakCheck</a>`;
  } else if (type === 'phone') {
    dorkHtml += `<a href="https://www.google.com/search?q=%22${q}%22+site:avito.ru" target="_blank" class="dork-link">Авито</a>`;
    dorkHtml += `<a href="https://yandex.ru/search/?text=%22${q}%22" target="_blank" class="dork-link">Яндекс</a>`;
  }

  dorkHtml += `</div>`;
  dorksContainer.innerHTML = dorkHtml;
  container.appendChild(dorksContainer);

  btn.disabled = false;
}
</script>
